services:
  sales-db:
    image: mysql:8.0
    container_name: sales-analytics-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sales_analytics
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sales-network

  sales-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sales-analytics-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://sales-db:3306/sales_analytics?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      sales-db:
        condition: service_healthy
    networks:
      - sales-network

  sales-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sales-analytics-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - sales-backend
    networks:
      - sales-network

volumes:
  mysql_data:

networks:
  sales-network:
    driver: bridge
