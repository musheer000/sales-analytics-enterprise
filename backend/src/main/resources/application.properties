# =============================================================================
# Sales Analytics & Reporting System - Application Configuration
# =============================================================================

spring.application.name=sales-analytics
server.port=${PORT:8080}

# -----------------------------------------------------------------------------
# MySQL Database Connection (Cloud Env Vars with Local Defaults)
# -----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sales_analytics?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------------------------------------------------------
# Hibernate / JPA Configuration
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -----------------------------------------------------------------------------
# Spring Caching Configuration
# -----------------------------------------------------------------------------
spring.cache.type=simple
spring.cache.cache-names=categories,products,analyticsSummary,categorySales,monthlyRevenue

# -----------------------------------------------------------------------------
# OpenAPI / Swagger Documentation
# -----------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# -----------------------------------------------------------------------------
# Logging Configuration
# -----------------------------------------------------------------------------
logging.level.com.salesanalytics=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.cache=DEBUG

# Allow circular references between SecurityConfig and custom Filters if needed
spring.main.allow-circular-references=true

# -----------------------------------------------------------------------------
# Email (Spring Boot Mail / Jakarta Mail) — STARTTLS port 587 (works on Render)
# -----------------------------------------------------------------------------
# Spring JavaMailSender config (replaces raw SSLSocket on port 465)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:shaikmusheer07@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Async thread pool for @Async email sending
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100

# Legacy alias kept for fromName injection in EmailService
app.mail.from-name=Sales Analytics Enterprise

# Razorpay Payment Gateway
app.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_TWMghMtesxGj8a}
